name: efd-daily-mirror

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: efd-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Scrape Senate eFD PTRs
        run: python scrape.py
      - name: Commit mirror if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/senate_ptrs.json
          git diff --staged --quiet || (git commit -m "data: refresh Senate PTRs $(date -u +%FT%TZ)" && git push)
