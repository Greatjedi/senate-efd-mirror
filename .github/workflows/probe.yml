name: efd-reachability-probe

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Probe eFD reachability
        run: python probe.py
      - name: Upload captured samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efd-samples
          path: |
            artifact_search.json
            artifact_detail.html
          if-no-files-found: warn
